preserve_hierarchy: true
pull_request_title: "fix(l10n): update approved translations"
commit_message: "fix(l10n): update %language% translations"
append_commit_message: false
# Use Crowdin language IDs here; English is the source, not an exported locale.
export_languages: [af, ar, ca, zh-CN, zh-TW, cs, da, nl, fi, fr, de, el, he, hu, it, ja, ko, "no", pl, pt-PT, pt-BR, ro, ru, sr, es-ES, sv-SE, tr, uk, vi]

files:
  - source: /src/app/Localization/Strings.resx
    dest: /Strings.resx
    translation: /src/app/Localization/Strings.%two_letters_code%.resx
    update_option: update_as_unapproved
    # Mirror these overrides in Crowdin Settings > Languages > Language Mapping.
    languages_mapping:
      two_letters_code:
        zh-CN: zh-Hans
        zh-TW: zh-Hant
        pt-BR: pt-BR
        "no": nb
        sr: sr-Cyrl
  - source: /src/headset/app/res/values/strings.xml
    dest: /Quest.xml
    type: android
    translation: /src/headset/app/res/values-%android_code%/strings.xml
    update_option: update_as_unapproved
    languages_mapping:
      android_code:
        zh-CN: b+zh+Hans
        zh-TW: b+zh+Hant
        "no": nb
        sr: b+sr+Cyrl
