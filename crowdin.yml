# Native GitHub integration: https://support.crowdin.com/github-integration/
# Authentication and the hourly sync schedule are managed in Crowdin.
preserve_hierarchy: true
pull_request_title: "Update approved translations"
commit_message: "Translate %original_file_name% into %language%"
append_commit_message: false

files:
  - source: /src/app/Localization/Strings.resx
    dest: /Strings.resx
    translation: /src/app/Localization/Strings.%two_letters_code%.resx
    excluded_target_languages:
      - en
    update_option: update_as_unapproved
    # Mirror these overrides in Crowdin Settings > Languages > Language Mapping.
    languages_mapping:
      two_letters_code:
        zh-CN: zh-Hans
        zh-TW: zh-Hant
        pt-BR: pt-BR
        no: nb
        sr: sr-Cyrl
